<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업종 심리 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#1d2321; --ink2:#5d6663; --ink3:#8b9491; --line:#e3e6e3; --line2:#eef0ee;
  --accent:#1f5f53;
  --c-hu:#e07f84; --c-qu:#f4cdd0; --c-ch:#ecd8b6; --c-ca:#eef0ef; --c-ou:#cbdaf1; --c-hd:#7ea2dc;
  --up:#d1344a; --dn:#2f62c4; --chip:#eef1ee; --warn:#b7791f;
  --q-lead:#e9f5ee; --q-weak:#fbf3e3; --q-lag:#fbeaea; --q-imp:#e8eef9;
  --s1:#c9ced0; --s2:#3f9f6f; --s3:#e0a53b; --s4:#d1344a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --panel:#1a1f1e; --ink:#e6ebe8; --ink2:#a3ada9; --ink3:#77817d; --line:#2a312f; --line2:#232a28;
    --accent:#6cc3ad;
    --c-hu:#8e3a42; --c-qu:#4f2c31; --c-ch:#4c4130; --c-ca:#232a28; --c-ou:#26364f; --c-hd:#2f4f86;
    --up:#ff7a8a; --dn:#7da7ff; --chip:#232a28; --warn:#e3b04b;
    --q-lead:#16271f; --q-weak:#2a2416; --q-lag:#2c1a1b; --q-imp:#18202f;
    --s1:#4a5250; --s2:#4fbf86; --s3:#e3b04b; --s4:#ff7a8a;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a1f1e; --ink:#e6ebe8; --ink2:#a3ada9; --ink3:#77817d; --line:#2a312f; --line2:#232a28;
  --accent:#6cc3ad;
  --c-hu:#8e3a42; --c-qu:#4f2c31; --c-ch:#4c4130; --c-ca:#232a28; --c-ou:#26364f; --c-hd:#2f4f86;
  --up:#ff7a8a; --dn:#7da7ff; --chip:#232a28; --warn:#e3b04b;
  --q-lead:#16271f; --q-weak:#2a2416; --q-lag:#2c1a1b; --q-imp:#18202f;
  --s1:#4a5250; --s2:#4fbf86; --s3:#e3b04b; --s4:#ff7a8a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 64px}
header h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line);color:var(--ink2);border-radius:4px;padding:1px 7px}
.desc{color:var(--ink2);font-size:13px;margin:8px 0 0;max-width:860px}
.meta{color:var(--ink3);font-size:12px;margin-top:6px}

.mtabs{display:flex;gap:6px;margin:18px 0 0;flex-wrap:wrap}
.mtabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:inherit;font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
.mtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vtabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.vtabs button{border:0;background:none;color:var(--ink2);font:inherit;font-size:14px;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.vtabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 12px}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--chip);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
select,input[type=number],input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 8px;font:inherit;font-size:13px}
input[type=number]{width:62px}
details.th{font-size:12.5px;color:var(--ink2)}
details.th summary{cursor:pointer;list-style:none;color:var(--accent)}
details.th summary::-webkit-details-marker{display:none}
details.th .box{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.hide{display:none!important}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg b{font-weight:600;color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:0;text-align:right;white-space:nowrap}
thead th{font-size:12px;font-weight:500;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
thead th.sortable{cursor:pointer}
thead th.sorted{color:var(--ink);font-weight:600}
th.l,td.l{text-align:left}
th.c,td.ctr{text-align:center}
.grid td{border-bottom:1px solid var(--line2);height:46px}
.grid td.sec{padding:0 12px;min-width:160px;position:sticky;left:0;background:var(--panel);z-index:1}
.grid td.sec b{font-weight:500}
.grid td.sec span{color:var(--ink3);font-size:12px;margin-left:4px}
.grid td.sec small{display:block;color:var(--ink3);font-size:11px;line-height:1.2}
.grid tr.sub td.sec{padding-left:30px;background:var(--bg)}
.grid tr.sub td.sec b{font-size:13px}
.grid tr.sub td{height:40px}
.tog{display:inline-block;width:16px;color:var(--ink3);cursor:pointer;user-select:none}
.grid td.c{min-width:116px;padding:5px 12px;cursor:pointer;border-left:1px solid var(--panel)}
.grid td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.c.empty{cursor:default;color:var(--ink3);text-align:center}
.grid td.c.empty:hover{outline:none}
.grid td.wk{border-left:2px solid var(--line)}
.c .k{font-size:12px;font-weight:600;display:block}
.c .v{font-size:11.5px;color:var(--ink2)}
.c.hu .v,.c.hd .v{color:var(--ink)}
.hu{background:var(--c-hu)} .qu{background:var(--c-qu)} .ch{background:var(--c-ch)}
.ca{background:var(--c-ca)} .ou{background:var(--c-ou)} .hd{background:var(--c-hd)}
.mk td{background:var(--bg);font-size:12px;color:var(--ink2);height:34px}
.mk td.sec{background:var(--bg)}
.ev{display:inline-block;margin-left:4px;color:var(--warn);cursor:help}
.foot{color:var(--ink3);font-size:12px;margin-top:12px}
.note{margin-top:28px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.note h3{font-size:13px;color:var(--ink);margin:0 0 6px}
.note table{width:auto;margin:6px 0 10px;font-size:12px}
.note td,.note th{padding:4px 10px;border:1px solid var(--line);text-align:center}
.pos{color:var(--up)} .neg{color:var(--dn)}
h2.sh{font-size:17px;margin:30px 0 4px;display:flex;align-items:center;gap:8px}
.sdesc{color:var(--ink2);font-size:12.5px;margin:0 0 10px;max-width:900px}
.tbl td{border-bottom:1px solid var(--line2);padding:8px 12px;font-size:13px}
.tbl th{padding:9px 12px}
.tbl td.l b{font-weight:500}
.tbl td.l span,.tbl td.l small{color:var(--ink3);font-size:12px;margin-left:4px}
.tbl td.l span.state{color:var(--ink);margin-left:0;font-size:11.5px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--bg)}
.tbl td.wk,.tbl th.wk{border-right:2px solid var(--line)}
.tbl tr.conc td,.tbl tr.base td{background:var(--bg);color:var(--ink2)}
.empty-state{padding:60px 20px;text-align:center;color:var(--ink2)}

/* 3국 비교 */
.xc{min-width:128px;padding:5px 12px!important}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.up{color:var(--up);border-color:var(--up)} .badge.dn{color:var(--dn);border-color:var(--dn)}
.stale{color:var(--warn);font-size:10.5px;display:block}

/* 연속성 */
.strip td.s{width:30px;min-width:30px;height:30px;padding:0;border-left:2px solid var(--panel);text-align:center;font-size:10.5px;font-weight:600;color:var(--ink)}
.strip td{border-bottom:1px solid var(--line2);padding:6px 12px;font-size:13px}

/* 로테이션 */
.rrg-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:900px){.rrg-wrap{grid-template-columns:1fr}}
.rrg svg{width:100%;height:auto;display:block}
.rrg text{font-family:"IBM Plex Sans KR",system-ui,sans-serif}
.rlist td{padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--line2)}
.rlist tr{cursor:pointer}
.rlist tr.on td{background:var(--bg);font-weight:600}
.qd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* 추세·폭 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .n{font-size:22px;font-weight:600;margin-top:2px}
.kpi .d{font-size:12px;color:var(--ink3)}
.dist{display:flex;height:12px;border-radius:3px;overflow:hidden;min-width:120px;background:var(--line2)}
.dist i{display:block;height:100%}
.spark{display:block}
.mx td{padding:8px 10px;font-size:13px;border:1px solid var(--line2);text-align:center;cursor:pointer}
.mx th{padding:8px 10px;font-size:12px;color:var(--ink2);text-align:center}
.mx td.z{color:var(--ink3);cursor:default}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chipb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.state{display:inline-block;min-width:64px;text-align:center;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px}
.st2{background:var(--c-hu)} .st1{background:var(--c-qu)} .st0{background:var(--c-ca)} .stm1{background:var(--c-ou)} .stm2{background:var(--c-hd)}
.stg{display:inline-block;min-width:22px;text-align:center;font-weight:600;border-radius:4px;color:#fff;font-size:12px;padding:1px 5px}
.stg1{background:var(--s1);color:var(--ink)} .stg2{background:var(--s2)} .stg3{background:var(--s3)} .stg4{background:var(--s4)}

/* 신호 검증 */
.sig td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line2)}
.sig th{padding:8px 12px}
.sig th.g{text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
.sig td.lead{border-left:2px solid var(--line)}
.warnbox{border-left:3px solid var(--warn);background:var(--panel);padding:10px 14px;font-size:12.5px;color:var(--ink2);margin:12px 0;border-radius:0 8px 8px 0;line-height:1.7}

/* 신고가 */
.nhg{margin:18px 0 0}
.nhg-h{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.nhg-h span{color:var(--ink3);font-size:12.5px}
.nhgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.nhcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.nhh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nhh b{font-size:14px} .nhh small{color:var(--ink3);margin-left:2px}
.nhm{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhc{width:100%;height:110px;display:block}
.nhc-empty{height:110px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;background:var(--bg);border-radius:6px}
.nhl{font-size:12px;margin:6px 0 4px;color:var(--ink3)}
.nhl a,.nhmat a,#view .tbl a{color:var(--accent);text-decoration:none}
#view .tbl a:hover{text-decoration:underline}
.nhl a:hover,.nhmat a:hover{text-decoration:underline}
.nhmat{margin:4px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:1.45}
.nhmat li{margin:3px 0;padding-left:34px;text-indent:-34px}
.nhmat li::before{display:inline-block;width:30px;text-indent:0;font-size:10.5px;font-weight:600;border-radius:3px;text-align:center;margin-right:4px}
.nhmat li.f::before{content:"공시";background:var(--c-hu);color:var(--ink)}
.nhmat li.n::before{content:"뉴스";background:var(--chip);color:var(--ink2)}
.nhmat li span{color:var(--ink3);font-size:11px}
.nhmat-none{font-size:12px;color:var(--ink3);margin-top:4px}

/* 드릴다운 */
.sheet{position:fixed;inset:0;background:rgba(10,14,13,.45);display:none;z-index:20}
.sheet.open{display:block}
.pane{position:absolute;right:0;top:0;bottom:0;width:min(1140px,100%);background:var(--bg);overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
.pane .dhd{padding:20px 20px 0}
.crumb{font-size:12px;color:var(--accent)}
.pane h2{margin:2px 0 4px;font-size:22px;padding-right:70px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.stats b{font-weight:600}
.close{position:absolute;right:18px;top:18px}
.tools{display:flex;gap:10px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.tools .cnt{font-size:12px;color:var(--ink3)}
.pane .card{margin:0 20px 30px}
.st td{border-bottom:1px solid var(--line2);padding:8px 10px;font-size:13px}
.st th{padding:9px 10px}
.st td.nm{min-width:190px}
.st td.nm b{font-weight:600}
.st td.nm small{color:var(--ink3);margin-left:4px;font-size:11.5px}
.st td.ind{color:var(--ink2);font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.st .hl{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
@media (max-width:640px){
  .wrap{padding:20px 12px 48px}
  .grid td.c{min-width:92px;padding:5px 8px}
  .grid td.sec{min-width:118px;padding:0 8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>업종 심리 지도 <span class="tag" id="mtag">미국</span></h1>
    <p class="desc" id="vdesc"></p>
    <div class="meta" id="meta">불러오는 중…</div>
    <div class="mtabs" id="mtabs"></div>
    <nav class="vtabs" id="vtabs">
      <button data-v="map">심리 지도</button>
      <button data-v="cross">3국 비교</button>
      <button data-v="rrg">로테이션</button>
      <button data-v="streak">연속성</button>
      <button data-v="trend">추세·폭</button>
      <button data-v="signal">신호 검증</button>
      <button data-v="newhigh">신고가</button>
    </nav>
  </header>

  <div class="bar" id="bar">
    <div class="grp" data-show="map cross rrg streak">
      <button class="btn" id="prev" aria-label="이전 주">◀</button>
      <select id="week"></select>
      <button class="btn" id="next" aria-label="다음 주">▶</button>
    </div>
    <div class="grp" data-show="map cross rrg streak signal"><label>단위</label>
      <div class="seg" data-k="unit"><button data-v="sector">섹터</button><button data-v="industry">산업</button></div></div>
    <div class="grp" data-show="map cross rrg streak signal" data-unit="industry"><label>섹터</label><select id="secf"></select>
      <label>최소</label><input type="number" id="minn" min="1" step="1"><label>종목</label></div>
    <div class="grp" data-show="map cross rrg streak signal"><label>가중</label>
      <div class="seg" data-k="weight"><button data-v="cw">시총</button><button data-v="ew">동일</button></div></div>
    <div class="grp" data-show="map cross streak signal"><label>등락 기준</label>
      <div class="seg" data-k="mode"><button data-v="fixed">고정 %p</button><button data-v="sigma">변동성 σ</button></div></div>
    <div class="grp" data-show="map cross streak signal"><label>거래 기준</label>
      <div class="seg" data-k="turn"><button data-v="tv">거래대금</button><button data-v="vr">거래량</button></div></div>
    <div class="grp" data-show="signal"><label>주기</label>
      <div class="seg" data-k="freq"><button data-v="week">주간</button><button data-v="day">일간</button></div></div>
    <div class="grp" data-show="rrg"><label>꼬리</label>
      <div class="seg" data-k="tail"><button data-v="4">4주</button><button data-v="8">8주</button><button data-v="12">12주</button></div></div>
    <details class="th" data-show="map cross streak"><summary>기준값 조정</summary>
      <div class="box">
        <label>일간 ±<input type="number" step="0.1" data-t="dR">%p</label>
        <label>주간 ±<input type="number" step="0.1" data-t="wR">%p</label>
        <label>σ 기준 ±<input type="number" step="0.1" data-t="zR">σ</label>
        <label>일간 거래 <input type="number" step="0.01" data-t="dT">배</label>
        <label>주간 거래 <input type="number" step="0.01" data-t="wT">배</label>
        <button class="btn" id="reset">초기화</button>
      </div>
    </details>
  </div>

  <main id="view"></main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="pane">
    <button class="btn close" id="close">닫기</button>
    <div class="dhd">
      <div class="crumb" id="crumb"></div>
      <h2 id="dtitle"></h2>
      <div class="stats" id="dstats"></div>
    </div>
    <div class="tools" id="dtools"></div>
    <div class="card"><div class="scroll"><table class="st" id="stocks"></table></div></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
