name: toss-sector-sync
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/toss_classify.py'
      - '.github/workflows/toss-classification.yml'
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "조회만 하고 저장 안 함 (첫 연결 확인용)"
        type: boolean
        default: true
      probe:
        description: "연결 확인: 처음 3개 섹터만 조회 (dry-run 전용)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: toss-sector-sync
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  sync:
    if: github.event_name != 'schedule' || vars.TOSS_ENABLED == 'true'
    # Use a runner whose outbound IP is registered with Toss.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test classification
        run: |
          python -m unittest tests.test_toss_classify tests.test_taxonomy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.test_newhigh
      - name: Sync official sector classifications
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROBE: ${{ inputs.probe }}
          EVENT: ${{ github.event_name }}
        run: |
          $syncArgs = @()
          if ($env:DRY_RUN -eq 'true') {
            $syncArgs += '--dry-run'
            if ($env:PROBE -eq 'true') { $syncArgs += @('--max-sectors', '3') }
          }
          python -m pipeline.toss_classify @syncArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit classification cache
        if: inputs.dry_run != true
        run: |
          git config user.name sector-mood-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newhigh/toss
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git commit -m "classification: sync Toss sector memberships"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git pull --rebase --autostash
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          exit 1
