name: toss-sector-sync
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "조회만 하고 저장 안 함 (첫 연결 확인용)"
        type: boolean
        default: true
      probe:
        description: "연결 확인: 처음 3개 섹터만 조회 (dry-run 전용)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: toss-sector-sync
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  sync:
    if: github.event_name != 'schedule' || vars.TOSS_ENABLED != 'false'
    # Use a runner whose outbound IP is registered with Toss.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    defaults:
      run:
        shell: cmd
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare existing Python
        run: |
          py -3 -m venv .venv
          if errorlevel 1 exit /b 1
      - name: Install dependencies
        run: .venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Test classification
        run: |
          .venv\Scripts\python.exe -m unittest tests.test_toss_classify tests.test_taxonomy
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m tests.test_newhigh
          if errorlevel 1 exit /b 1
      - name: Sync official sector classifications
        shell: py -3 {0}
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROBE: ${{ inputs.probe }}
        run: |
          import os
          import subprocess
          args = [r".venv\Scripts\python.exe", "-m", "pipeline.toss_classify"]
          if os.environ.get("DRY_RUN") == "true":
              args.append("--dry-run")
              if os.environ.get("PROBE") == "true":
                  args.extend(["--max-sectors", "3"])
          subprocess.run(args, check=True)
      - name: Commit classification cache
        if: inputs.dry_run != true
        shell: py -3 {0}
        run: |
          import subprocess
          def git(*args):
              return subprocess.run(["git", *args], check=True)
          git("config", "user.name", "sector-mood-bot")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("add", "data/newhigh/toss")
          result = subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode
          if result == 0:
              raise SystemExit(0)
          if result != 1:
              raise SystemExit(result)
          git("commit", "-m", "classification: sync Toss sector memberships")
          for attempt in range(5):
              git("pull", "--rebase", "--autostash")
              if subprocess.run(["git", "push"]).returncode == 0:
                  break
          else:
              raise SystemExit("Could not push classification cache after 5 attempts")
