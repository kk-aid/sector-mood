name: dart-classification-review
on:
  schedule:
    - cron: "50 20 * * 0"
  workflow_dispatch:
    inputs:
      codes:
        description: "국내 종목코드 (쉼표 구분, 비우면 미수집/오래된 순)"
        default: ""
      limit:
        description: "최대 기업 수 (1..200)"
        default: "40"
      dry_run:
        description: "수집·검증만 하고 저장 안 함"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: dart-classification-review
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test classification and existing alerts
        run: |
          python -m unittest tests.test_taxonomy
          python -m tests.test_newhigh
      - name: Collect DART evidence (never auto-approve labels)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CODES: ${{ inputs.codes }}
          LIMIT: ${{ inputs.limit || '40' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--limit "$LIMIT")
          if [ -n "$CODES" ]; then ARGS+=(--codes "$CODES"); fi
          if [ "$DRY_RUN" = true ]; then ARGS+=(--dry-run); fi
          python -m pipeline.dart_classify "${ARGS[@]}"
      - name: Commit evidence candidates
        if: inputs.dry_run != true
        run: |
          git config user.name sector-mood-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newhigh/classification
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "classification: refresh DART review candidates"
          for ATTEMPT in 1 2 3 4 5; do
            git pull --rebase --autostash
            if git push; then exit 0; fi
          done
          exit 1
