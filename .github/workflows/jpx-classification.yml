name: jpx-sector-sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jpx-classification.yml'
      - 'pipeline/jpx_classify.py'
      - 'tests/test_jpx_classify.py'
  schedule:
    - cron: '15 21 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sector-mood
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check JPX parser and classification
        run: |
          python -m unittest tests.test_jpx_classify tests.test_site_classification tests.test_taxonomy tests.test_toss_classify
          node --check docs/app.js
      - name: Collect complete official JPX list
        run: python -m pipeline.jpx_classify
      - name: Refresh Japanese maps and stored new-high pages
        run: |
          python -m pipeline.refresh_classification --market jp
          python -m pipeline.run --market jp --weeks 2
          python -m pipeline.weekly --all
      - name: Publish Japanese classification and regenerated data
        run: |
          git config user.name sector-mood-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newhigh/jpx data/newhigh/jp docs/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: apply JPX official Japanese sectors and industries"
          git pull --rebase --autostash
          git push
